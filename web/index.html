<!doctype html>
<html lang="zh-CN">
  <head>
    <title>Rho Aias</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5D87FF" />
    <meta
      name="description"
      content="Rho Aias"
    />
    <link rel="icon" type="image/svg+xml" href="src/assets/images/common/logo.svg" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          // 主题初始化失败，静默处理
        }
      })()
    </script>
  </head>

  <body>
    <noscript>请启用 JavaScript 以运行此应用。</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
